proofrunVersion: 1
id: socialcert-onboarding
name: Understand SocialCert and prepare a wallet
surface:
  repo: p2ppsr/socialcert-ui
  category: onboard
  audience: First-time account holder with an approved disposable fixture wallet
environment:
  kind: local-fixture
  baseUrl: http://127.0.0.1:8088
  deployment:
    system: local
    releaseSource: Record candidate UI/backend source revisions and built artifact digests before execution.
safety:
  stateChanging: false
  spendCap:
    amount: 0
    unit: USD
  testIdentities:
    - purpose: Isolated fixture-only wallet, mailbox/provider subject and feedback record
      source: Controlled test harness; no customer or personal accounts and no secrets in YAML.
  cleanup:
    required: true
    instructions: Verify per-case fixture/profile reset and receipt cleanup; never promise removal of
      real public chain/overlay data.
matrix:
  desktopBrowsers:
    - chromium
  mobileBrowsers: []
  mobileSimulators: []
  desktopWallets: []
  mobileWallets: []
  serverWallets: []
  networks:
    - local-fixture
preflight:
  commands: []
  requiredState:
    - NOT RUN; no passing run record exists.
    - "Executable definition: docs/proofrun/workflows/socialcert-onboarding.v1.proofrun.yaml"
    - Dedicated isolated fixture and mandatory domain oracle plugins registered; block admission if
      any prerequisite is absent.
    - Exact source/build and initial wallet permission baseline pinned; no external
      provider/model/spending allocation permitted.
flow:
  steps:
    - id: understand
      actor: target-user
      action: Open the homepage as a newcomer; explain the purpose and choose an available family without
        insider selectors.
      expected:
        ui:
          - Email, X and Discord prove control of an account; wallet storage and optional public
            lookup are explained.
        domain:
          - Independent oracle socialcert.release-identity passes with redacted retained evidence.
          - Independent oracle socialcert.family-availability passes with redacted retained evidence.
    - id: no-wallet
      actor: target-user
      action: Start a supported family with the isolated missing-wallet fixture, then use wallet retry
        after the fixture becomes available.
      expected:
        ui:
          - The wallet-status explains the next action; no verification or issuance happens merely
            on landing.
        domain:
          - Independent oracle socialcert.wallet-permission-baseline passes with redacted retained
            evidence.
          - Independent oracle socialcert.no-side-effects passes with redacted retained evidence.
    - id: keyboard
      actor: target-user
      action: Navigate purpose, family options, wallet guidance and help using the keyboard and 200% zoom.
      expected:
        ui:
          - Focus, labels and primary actions stay visible; socialcert-main is the main landmark.
        domain:
          - Independent oracle socialcert.accessible-controls passes with redacted retained evidence.
assertions:
  flowSuccess:
    - All required independent domain oracles pass; a page success message is insufficient.
  customerTrust:
    - Verification, issuance, publication and discoverability are distinguishable.
  reliabilityRepeatability:
    - Retries respect at-most-once effects and a reproducible clean starting state.
  telemetryObservability:
    - Sensitive values are absent; missing correlation evidence is blocked.
evidence:
  screenshots: true
  logs: true
  privateArtifacts: Use approved private network-ops artifact storage; never commit PII/secrets.
  runRecords: docs/proofrun/runs/*.md only after actual execution; do not create placeholder passes.
