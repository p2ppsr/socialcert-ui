proofrunVersion: 1
id: socialcert-email
name: Verify email and acquire a certificate honestly
surface:
  repo: p2ppsr/socialcert-ui
  category: authenticate
  audience: First-time account holder with an approved disposable fixture wallet
environment:
  kind: local-fixture
  baseUrl: http://127.0.0.1:8088
  deployment:
    system: local
    releaseSource: Record candidate UI/backend source revisions and built artifact digests before execution.
safety:
  stateChanging: true
  spendCap:
    amount: 0
    unit: USD
  testIdentities:
    - purpose: Isolated fixture-only wallet, mailbox/provider subject and feedback record
      source: Controlled test harness; no customer or personal accounts and no secrets in YAML.
  cleanup:
    required: true
    instructions: Verify per-case fixture/profile reset and receipt cleanup; never promise removal of
      real public chain/overlay data.
matrix:
  desktopBrowsers:
    - chromium
  mobileBrowsers: []
  mobileSimulators: []
  desktopWallets: []
  mobileWallets: []
  serverWallets: []
  networks:
    - local-fixture
preflight:
  commands: []
  requiredState:
    - NOT RUN; no passing run record exists.
    - "Executable definition: docs/proofrun/workflows/socialcert-email.v1.proofrun.yaml"
    - Dedicated isolated fixture and mandatory domain oracle plugins registered; block admission if
      any prerequisite is absent.
    - Exact source/build and initial wallet permission baseline pinned; no external
      provider/model/spending allocation permitted.
flow:
  steps:
    - id: request-code
      actor: target-user
      action: Use email-address and send-code with a fixture-only disposable mailbox; leave
        publication-consent unchecked.
      expected:
        ui:
          - A challenge delivery stage appears with bounded progress and change-address/resend
            options.
        domain:
          - Independent oracle socialcert.family-availability passes with redacted retained evidence.
          - Independent oracle socialcert.challenge-delivery passes with redacted retained evidence.
    - id: verify-code
      actor: target-user
      action: Enter the fixture valid code using verification-code and verify-code; inspect the intended
        wallet action.
      expected:
        ui:
          - Provider verification leads to issuing, then issued only after a real wallet acquisition
            receipt.
        domain:
          - Independent oracle socialcert.wallet-permission-baseline passes with redacted retained
            evidence.
          - Independent oracle socialcert.verification-binding passes with redacted retained
            evidence.
          - Independent oracle socialcert.certificate-possession passes with redacted retained
            evidence.
    - id: private-result
      actor: target-user
      action: Leave disclosure unchecked and inspect the terminal result; reload after completing.
      expected:
        ui:
          - certificate-receipt agrees with wallet state; publication-status explains private
            storage, not public lookup.
        domain:
          - Independent oracle socialcert.private-nondisclosure passes with redacted retained
            evidence.
          - Independent oracle socialcert.terminal-state passes with redacted retained evidence.
    - id: wrong-code
      actor: target-user
      action: Reset to a separate isolated case; enter invalid or expired fixture code once, then use the
        documented bounded valid recovery.
      expected:
        ui:
          - No issuance follows invalid verification; remaining attempts and expiry errors are
            honest.
        domain:
          - Independent oracle socialcert.invalid-verification-no-issuance passes with redacted
            retained evidence.
          - Independent oracle socialcert.terminal-state passes with redacted retained evidence.
assertions:
  flowSuccess:
    - All required independent domain oracles pass; a page success message is insufficient.
  customerTrust:
    - Verification, issuance, publication and discoverability are distinguishable.
  reliabilityRepeatability:
    - Retries respect at-most-once effects and a reproducible clean starting state.
  telemetryObservability:
    - Sensitive values are absent; missing correlation evidence is blocked.
evidence:
  screenshots: true
  logs: true
  privateArtifacts: Use approved private network-ops artifact storage; never commit PII/secrets.
  runRecords: docs/proofrun/runs/*.md only after actual execution; do not create placeholder passes.
