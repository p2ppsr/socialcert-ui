proofrunVersion: 1
id: socialcert-privacy
name: Private certificate and consented public identity lookup
surface:
  repo: p2ppsr/socialcert-ui
  category: redeem
  audience: First-time account holder with an approved disposable fixture wallet
environment:
  kind: local-fixture
  baseUrl: http://127.0.0.1:8088
  deployment:
    system: local
    releaseSource: Record candidate UI/backend source revisions and built artifact digests before execution.
safety:
  stateChanging: true
  spendCap:
    amount: 0
    unit: USD
  testIdentities:
    - purpose: Isolated fixture-only wallet, mailbox/provider subject and feedback record
      source: Controlled test harness; no customer or personal accounts and no secrets in YAML.
  cleanup:
    required: true
    instructions: Verify per-case fixture/profile reset and receipt cleanup; never promise removal of
      real public chain/overlay data.
matrix:
  desktopBrowsers:
    - chromium
  mobileBrowsers: []
  mobileSimulators: []
  desktopWallets: []
  mobileWallets: []
  serverWallets: []
  networks:
    - local-fixture
preflight:
  commands: []
  requiredState:
    - NOT RUN; no passing run record exists.
    - "Executable definition: docs/proofrun/workflows/socialcert-privacy.v1.proofrun.yaml"
    - Dedicated isolated fixture and mandatory domain oracle plugins registered; block admission if
      any prerequisite is absent.
    - Exact source/build and initial wallet permission baseline pinned; no external
      provider/model/spending allocation permitted.
flow:
  steps:
    - id: private
      actor: target-user
      action: Acquire one certificate in the private fixture case without checking publication-consent.
      expected:
        ui:
          - No new public attribute is submitted or discoverable; private certificate remains usable
            in the wallet.
        domain:
          - Independent oracle socialcert.certificate-possession passes with redacted retained
            evidence.
          - Independent oracle socialcert.private-nondisclosure passes with redacted retained
            evidence.
          - Independent oracle socialcert.consent-scope passes with redacted retained evidence.
    - id: publish
      actor: target-user
      action: Reset to the declared consented case; inspect and explicitly select publication-consent,
        then complete publication.
      expected:
        ui:
          - Only the selected attributes are revealed after genuine acquisition; UI distinguishes
            issued from publishing/complete.
        domain:
          - Independent oracle socialcert.wallet-permission-baseline passes with redacted retained
            evidence.
          - Independent oracle socialcert.publication-receipt passes with redacted retained evidence.
          - Independent oracle socialcert.consent-scope passes with redacted retained evidence.
    - id: independent-lookup
      actor: target-user
      action: Use the independent relying-party fixture to resolve the disposable test subject after
        publication and after reload.
      expected:
        ui:
          - Human label, certifier/family/subject/trust and overlay evidence agree; not-found is
            distinct from query failure.
        domain:
          - Independent oracle socialcert.identity-lookup passes with redacted retained evidence.
          - Independent oracle socialcert.terminal-state passes with redacted retained evidence.
    - id: publication-failure
      actor: target-user
      action: Inject publication failure after successful issuance in the local fixture; inspect partial
        state and retry-publication.
      expected:
        ui:
          - The certificate stays issued; only publication retries; no renewed provider
            verification, extra issuance or expanded disclosure.
        domain:
          - Independent oracle socialcert.certificate-possession passes with redacted retained
            evidence.
          - Independent oracle socialcert.at-most-once-effects passes with redacted retained
            evidence.
          - Independent oracle socialcert.terminal-state passes with redacted retained evidence.
assertions:
  flowSuccess:
    - All required independent domain oracles pass; a page success message is insufficient.
  customerTrust:
    - Verification, issuance, publication and discoverability are distinguishable.
  reliabilityRepeatability:
    - Retries respect at-most-once effects and a reproducible clean starting state.
  telemetryObservability:
    - Sensitive values are absent; missing correlation evidence is blocked.
evidence:
  screenshots: true
  logs: true
  privateArtifacts: Use approved private network-ops artifact storage; never commit PII/secrets.
  runRecords: docs/proofrun/runs/*.md only after actual execution; do not create placeholder passes.
