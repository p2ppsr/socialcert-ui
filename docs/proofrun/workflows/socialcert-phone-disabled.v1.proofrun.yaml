apiVersion: proofrun.dev/v1
kind: Workflow
metadata:
  id: socialcert-phone-disabled
  name: Unavailable telephone family remains unavailable
  version: 1.0.0
  description: Authored first-wave acceptance contract; NOT RUN. Default local fixture scope only.
  labels:
    repository: p2ppsr/socialcert-ui
    category: discover
    executionStatus: not-run
    fidelity: desktop-browser-fixture
target:
  type: web
  url: http://127.0.0.1:8088
  environment: local-fixture
  admission: requires-isolated-mocked-providers-wallet-and-feedback
  productionEvidence: false
uses:
  - socialcert.wave1@1.0.0
matrix:
  maxCases: 1
  dimensions:
    agent:
      - scripted@1
    profile:
      - socialcert.newcomer@1.0.0
    device:
      - socialcert.chromium-desktop-fixture@1.0.0
capabilities:
  - browser.screenshot
  - browser.dom
  - browser.trace
  - socialcert.fixture-isolation
  - socialcert.domain-oracles
budget:
  maxCases: 1
  maxProviderCalls: 0
  maxInputTokens: 0
  maxOutputTokens: 0
  maxCostUsd: 0
  perCase:
    maxProviderCalls: 0
    maxInputTokens: 0
    maxOutputTokens: 0
    maxCostUsd: 0
  onExceed: block
intelligence:
  mode: fixed
  initialTier: economy
  maxEscalations: 0
  observation:
    mode: fixed
    initialDetail: low
    escalationDetail: low
journeys:
  - id: phone-disabled
    goal: Unavailable telephone family remains unavailable
    role: Approved disposable fixture account holder
    start: Clean isolated local state; no existing standing grants unless a separately declared
      returning case requires them.
    maxActions: 32
    maxSeconds: 180
    steps:
      - id: availability
        instruction: Inspect family availability and phone-unavailable on the homepage without submitting a
          phone number.
        expected: Telephone is clearly unavailable; supported alternative families are obvious.
        oracleRefs:
          - socialcert.family-availability
          - socialcert.no-side-effects
        evidence:
          - screenshot
          - trace
          - log
        onFailure: stop
      - id: deep-link
        instruction: Open /PhoneVerification and the old phone-code route with no supplied state; do not
          contact an SMS provider.
        expected: An honest unavailable-family explanation/help replaces issuance controls; no legacy route
          silently starts sending.
        oracleRefs:
          - socialcert.disabled-family-boundary
          - socialcert.no-side-effects
        evidence:
          - screenshot
          - trace
          - log
        onFailure: stop
assertions:
  - id: independent-state-1
    type: oracle
    severity: fail
    oracle: socialcert.family-availability
    journey: phone-disabled
    statement: Required socialcert.family-availability acceptance agrees with actual domain state and
      immutable redacted evidence; missing proof cannot pass.
  - id: independent-state-2
    type: oracle
    severity: fail
    oracle: socialcert.no-side-effects
    journey: phone-disabled
    statement: Required socialcert.no-side-effects acceptance agrees with actual domain state and
      immutable redacted evidence; missing proof cannot pass.
  - id: independent-state-3
    type: oracle
    severity: fail
    oracle: socialcert.disabled-family-boundary
    journey: phone-disabled
    statement: Required socialcert.disabled-family-boundary acceptance agrees with actual domain state
      and immutable redacted evidence; missing proof cannot pass.
policy:
  unsafeContent: stop
  highImpactActions: deny
  allowedHosts:
    - 127.0.0.1
    - localhost
  spendLimit: 0
  spendUnit: USD
  warnExitCode: 2
remediation:
  mode: manual
  allowed: false
  proposalOnly: true
  requiredApprovers: 1
