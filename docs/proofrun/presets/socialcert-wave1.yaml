      required: true
      admission: block-if-unavailable
      evidenceContract: docs/proofrun/oracles.md
    socialcert.verification-binding:
      plugin: socialcert.verification-binding
      required: true
      admission: block-if-unavailable
      evidenceContract: docs/proofrun/oracles.md
    socialcert.certificate-possession:
